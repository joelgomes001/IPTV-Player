<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>Indian & Global IPTVs</title>
  <meta name="description" content="Indian & Global IPTVs - Watch Live TV Channels sorted by Country or Genre with live server sync.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <!-- HLS.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Firebase App, Analytics & Firestore SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
    import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_1eSe9vAO_nprRNh5mYoxTUkt3UGLOoc",
      authDomain: "classic-iptv.firebaseapp.com",
      projectId: "classic-iptv",
      storageBucket: "classic-iptv.firebasestorage.app",
      messagingSenderId: "699344040730",
      appId: "1:699344040730:web:2cffc369663b630573b2a3",
      measurementId: "G-7XDVWV703Q"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    
    window.firebaseApp = app;
    window.firebaseAnalytics = analytics;
    window.firebaseDb = db;
    window.firestoreTools = { collection, getDocs, setDoc, doc };

    window.logFirebaseEvent = (eventName, params) => {
      if (analytics) {
        logEvent(analytics, eventName, params);
      }
    };
    console.log("Firebase App, Analytics & Firestore initialized successfully for classic-iptv");
  </script>
</head>
<body>

  <!-- Mobile Sidebar Drawer Overlay -->
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <!-- Top Navigation Bar -->
  <header class="navbar xp-title-bar">
    <div class="nav-brand-row">
      <button id="btnToggleSidebar" class="xp-button mobile-menu-btn" title="Open Categories & Countries">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span>Menu</span>
      </button>

      <div class="brand" id="brandLogo" style="cursor: pointer;" title="Go to Home">
        <div class="brand-icon">
          <img src="logo.png" alt="Indian & Global IPTVs" style="width: 22px; height: 22px; object-fit: contain; display: block;">
        </div>
        <span class="brand-title">Indian & Global IPTVs</span>
      </div>

      <div id="statusBadge" class="status-badge">
        <span style="color:#fef08a;">● Connecting...</span>
      </div>

      <button id="btnRefresh" class="xp-button sync-btn" title="Fetch latest channels from servers">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span class="sync-text">Sync Server</span>
      </button>
    </div>

    <div class="nav-controls">
      <div class="search-box">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search channels..." autocomplete="off">
          <button id="btnSearch" class="xp-button search-btn" title="Search All Channels">Search</button>
        </div>
        <!-- Live Instant Search Dropdown -->
        <div id="searchDropdown" class="search-dropdown"></div>
      </div>
    </div>
  </header>

  <!-- App Layout Grid -->
  <div class="app-layout">
    
    <!-- Sidebar Navigation Menu -->
    <aside id="sidebar" class="sidebar xp-window">
      <div class="xp-window-header">
        <span class="xp-window-title">Navigation Menu</span>
      </div>

      <div class="sidebar-content">
        <!-- Quick Access Links -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Quick Access</div>
          <button class="sidebar-nav-item active" data-type="quick" data-value="All">
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
              </svg>
              <span>All Channels</span>
            </div>
          </button>

          <button class="sidebar-nav-item" data-type="quick" data-value="Favorites">
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
              </svg>
              <span>Favorites</span>
            </div>
          </button>

          <button class="sidebar-nav-item" data-type="quick" data-value="Recent">
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span>Recent History</span>
            </div>
          </button>
        </div>

        <!-- Filter by Country / Region -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Filter by Country</div>
          <div id="sidebarCountriesContainer"></div>
        </div>

        <!-- Filter by Genre -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Filter by Genre</div>
          <div id="sidebarGenresContainer"></div>
        </div>
      </div>
    </aside>

    <!-- Main Content Body -->
    <main class="main-container">

      <!-- Compact Mobile/Tablet Filter Controls Bar (Dropdowns + Quick Pills) -->
      <div class="filter-controls-bar">
        <div class="filter-dropdowns-row">
          <div class="filter-select-wrapper">
            <select id="countrySelect" class="xp-select" aria-label="Filter by Country">
              <option value="All">🌐 All Countries</option>
            </select>
          </div>

          <div class="filter-select-wrapper">
            <select id="genreSelect" class="xp-select" aria-label="Filter by Genre">
              <option value="All">🎭 All Genres</option>
            </select>
          </div>
        </div>

        <!-- Quick Access Filter Pills -->
        <div id="mobileFilterBar" class="mobile-filter-bar">
          <button class="mobile-pill active" data-type="country" data-value="All">🌐 All</button>
          <button class="mobile-pill" data-type="country" data-value="India">🇮🇳 India</button>
          <button class="mobile-pill" data-type="country" data-value="United States">🇺🇸 USA</button>
          <button class="mobile-pill" data-type="country" data-value="United Kingdom">🇬🇧 UK</button>
          <button class="mobile-pill" data-type="country" data-value="Canada">🇨🇦 Canada</button>
          <button class="mobile-pill" data-type="country" data-value="Germany">🇩🇪 Germany</button>
          <button class="mobile-pill" data-type="genre" data-value="News">📰 News</button>
          <button class="mobile-pill" data-type="genre" data-value="Movies">🎬 Movies</button>
          <button class="mobile-pill" data-type="genre" data-value="Sports">⚽ Sports</button>
          <button class="mobile-pill" data-type="genre" data-value="Music">🎵 Music</button>
          <button class="mobile-pill" data-type="genre" data-value="DD Channels">📺 DD Channels</button>
        </div>
      </div>

      <!-- Embedded Video Player Section -->
      <section id="playerWrapper" class="player-wrapper xp-window">
        <div class="xp-window-header">
          <h2 id="currentChannelTitle" class="playing-title">Live Channel</h2>
          <div class="player-actions">
            <button id="btnPip" class="xp-button" title="Picture-in-Picture mode">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11h-8v6h8v-6zm4-8H1c-.55 0-1 .45-1 1v16c0 .55.45 1 1 1h22c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zm-2 16H3V5h18v14z"/>
              </svg>
              PiP Mode
            </button>
            <button id="btnClosePlayer" class="xp-button xp-btn-close-player" title="Close Video Player and return to channels">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
              Close Player
            </button>
          </div>
        </div>
        <div id="videoContainer" class="video-container">
          <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
      </section>

      <!-- Active Filters & Channel Grid Header -->
      <section class="xp-window" style="padding: 1.25rem;">
        <div class="grid-header-bar">
          <div class="active-filter-badge">
            <svg width="14" height="14" fill="none" stroke="#0055ea" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
            </svg>
            Viewing: <span id="activeFilterText">All Channels</span>
          </div>
          <div style="font-size: 0.9rem; font-weight: 700; color: #444;">
            Channels <span id="channelCount" style="color: #0055ea;"></span>
          </div>
        </div>

        <div class="channels-grid" id="channelsGrid"></div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
