<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>Indian & Global IPTVs - Channel Admin</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Admin Specific Extensions matching website design */
    .admin-login-card {
      background: #ffffff;
      border: 2px solid #0037a4;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .admin-modal-card {
      background: #ffffff;
      border: 2px solid #0037a4;
      border-radius: 8px;
      width: 100%;
      max-width: 580px;
      padding: 2rem;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .admin-form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .admin-form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #333333;
      margin-bottom: 0.35rem;
    }

    .admin-table-wrapper {
      background: #ffffff;
      border: 1px solid var(--xp-border-dark);
      border-radius: 6px;
      overflow-x: auto;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.1);
    }

    table.admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.admin-table th {
      background: var(--xp-blue-gradient);
      color: #ffffff;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-bottom: 2px solid #0037a4;
    }

    table.admin-table td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
      font-size: 0.9rem;
    }

    table.admin-table td img,
    .channel-logo-img {
      width: 40px !important;
      height: 40px !important;
      max-width: 40px !important;
      max-height: 40px !important;
      object-fit: contain !important;
      background: #000000;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 4px;
      display: block;
    }

    table.admin-table tr:hover {
      background: #eef6ff;
    }

    .badge-genre {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-country {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      background: #fef3c7;
      color: #b45309;
      font-size: 0.78rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Login Modal Overlay -->
  <div id="loginOverlay" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 99999;">
    <div class="admin-login-card">
      <div class="xp-title-bar" style="margin: -2.5rem -2.5rem 1.5rem -2.5rem; padding: 0.6rem 1rem; border-top-left-radius: 6px; border-top-right-radius: 6px; font-weight: 700;">
        🔒 JTBS IPTV Admin Authentication
      </div>
      <p style="color: #555555; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter Admin Password to manage channels</p>
      
      <input type="password" id="adminPasswordInput" class="xp-input" style="width: 100%; margin-bottom: 1rem; padding: 0.65rem 0.85rem;" placeholder="Enter Admin Password" autocomplete="current-password">
      <button id="btnLogin" class="xp-button sync-btn" style="width: 100%; padding: 0.65rem; justify-content: center; font-size: 0.95rem;">Login to Admin Panel</button>
      <div id="loginError" style="color: var(--xp-accent-red); font-size: 0.85rem; margin-top: 1rem; display: none; font-weight: 600;">Incorrect password!</div>
    </div>
  </div>

  <!-- Top Navigation Bar (Identical to User Website) -->
  <header class="navbar xp-title-bar">
    <div class="nav-brand-row">
      <div class="brand" id="brandLogo" style="cursor: pointer;" onclick="window.location.href='index.html'" title="Return to Main Player">
        <div class="brand-icon">
          <img src="logo.png" alt="Indian & Global IPTVs" style="width: 22px; height: 22px; object-fit: contain; display: block;">
        </div>
        <span class="brand-title">Indian & Global IPTVs — Admin</span>
      </div>

      <div id="statusBadge" class="status-badge">
        <span style="color:#ffffff;" id="statChannelCount">● 0 Channels</span>
      </div>

      <a href="index.html" class="xp-button sync-btn" style="text-decoration:none; display: inline-flex; align-items: center; gap: 0.35rem;" title="Go to User Website">
        <span>🏠 Main Player</span>
      </a>
    </div>

    <div class="nav-controls" style="gap: 0.5rem;">
      <button id="btnCopyM3uLink" class="xp-button sync-btn" title="Copy M3U Playlist URL for VLC / TiviMate / IPTV Players">
        <span>📋 Copy M3U Link</span>
      </button>

      <a href="playlist.m3u" download="playlist.m3u" class="xp-button sync-btn" style="text-decoration: none;" title="Download M3U Playlist File">
        <span>📥 Download M3U</span>
      </a>

      <button id="btnSaveGithub" class="xp-button sync-btn" style="background: linear-gradient(to bottom, #2e7d32 0%, #1b5e20 100%); color: #fff; font-weight: 700;" title="Save and publish database changes live instantly">
        <span>💾 Save & Publish Database</span>
      </button>

      <button id="btnLogout" class="xp-button sync-btn" style="background: linear-gradient(to bottom, #d32f2f 0%, #9a0007 100%); color: #fff;" title="Logout from Admin">
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-layout" style="padding: 1.5rem; max-width: 1400px; margin: 0 auto; display: block;">
    
    <!-- Controls Toolbar -->
    <div style="background: #ffffff; border: 1px solid var(--xp-border-dark); border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
      <div style="display: flex; gap: 0.75rem; flex: 1; flex-wrap: wrap; min-width: 280px;">
        <input type="text" id="adminSearchInput" class="xp-input" style="flex: 1; min-width: 220px; padding: 0.5rem 0.85rem;" placeholder="Search channel name or stream link...">
        
        <select id="adminGenreSelect" class="xp-select" style="min-width: 160px; padding: 0.5rem 0.85rem;">
          <option value="All">All Genres</option>
        </select>

        <select id="adminCountrySelect" class="xp-select" style="min-width: 160px; padding: 0.5rem 0.85rem;">
          <option value="All">All Countries</option>
        </select>
      </div>

      <button id="btnAddNewChannel" class="xp-button sync-btn" style="background: linear-gradient(to bottom, #f57c00 0%, #e65100 100%); color: #fff; font-weight: 700; padding: 0.55rem 1.1rem;">
        ➕ Add New Channel
      </button>
    </div>

    <!-- Channels Table -->
    <div class="admin-table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th style="width: 55px;">Logo</th>
            <th>Channel Name</th>
            <th style="width: 130px;">Genre</th>
            <th style="width: 130px;">Country</th>
            <th>Stream URL</th>
            <th style="width: 140px; text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr>
            <td colspan="6" style="text-align: center; padding: 3rem; color: #666666;">Loading master channel database...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div style="display: flex; gap: 0.75rem; align-items: center; justify-content: center; margin-top: 1.25rem;">
      <button id="btnPrevPage" class="xp-button" style="padding: 0.4rem 1rem;">Previous</button>
      <span id="pageIndicator" style="font-size: 0.88rem; font-weight: 600; color: #444444;">Page 1 of 1</span>
      <button id="btnNextPage" class="xp-button" style="padding: 0.4rem 1rem;">Next</button>
    </div>

  </main>

  <!-- Edit/Add Modal Overlay -->
  <div id="editModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 1rem;">
    <div class="admin-modal-card">
      <div class="xp-title-bar" style="margin: -2rem -2rem 1.25rem -2rem; padding: 0.6rem 1rem; border-top-left-radius: 6px; border-top-right-radius: 6px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
        <span id="modalTitle">Edit Channel</span>
        <button id="btnCloseModalX" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; line-height: 1;">✕</button>
      </div>

      <input type="hidden" id="editChannelId">

      <div class="admin-form-group">
        <label for="editName">Channel Name</label>
        <input type="text" id="editName" class="xp-input" style="width:100%; padding:0.5rem 0.75rem;" placeholder="e.g. DD National HD">
      </div>

      <div class="admin-form-group">
        <label for="editGenre">Genre / Category</label>
        <select id="editGenre" class="xp-select" style="width:100%; padding:0.5rem 0.75rem;">
          <option value="Entertainment">Entertainment</option>
          <option value="News">News</option>
          <option value="Movies">Movies</option>
          <option value="Music">Music</option>
          <option value="Sports">Sports</option>
          <option value="Religious">Religious</option>
          <option value="Kids">Kids</option>
          <option value="Documentary">Documentary</option>
          <option value="Lifestyle">Lifestyle</option>
          <option value="General">General</option>
          <option value="Education">Education</option>
          <option value="Shopping">Shopping</option>
          <option value="DD Channels">DD Channels</option>
        </select>
      </div>

      <div class="admin-form-group">
        <label for="editCountry">Country</label>
        <input type="text" id="editCountry" class="xp-input" style="width:100%; padding:0.5rem 0.75rem;" placeholder="e.g. India, United States, Bangladesh...">
      </div>

      <div class="admin-form-group">
        <label for="editStreamUrl">Stream URL (.m3u8 / HLS / YouTube)</label>
        <input type="text" id="editStreamUrl" class="xp-input" style="width:100%; padding:0.5rem 0.75rem;" placeholder="https://domain.com/live.m3u8">
      </div>

      <div class="admin-form-group">
        <label for="editThumbnail">Direct Logo Image URL</label>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
          <input type="text" id="editThumbnail" class="xp-input" style="flex:1; padding:0.5rem 0.75rem;" placeholder="https://logo-url.png">
          <img id="previewLogo" src="" style="width: 36px; height: 36px; object-fit: contain; background: #000; border-radius: 4px; display: none;">
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
        <button id="btnCancelEdit" class="xp-button" style="padding: 0.5rem 1.25rem;">Cancel</button>
        <button id="btnSaveChannel" class="xp-button sync-btn" style="background: linear-gradient(to bottom, #2e7d32 0%, #1b5e20 100%); color: #fff; font-weight: 700; padding: 0.5rem 1.25rem;">Save Channel</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
