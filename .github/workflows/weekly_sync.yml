name: Weekly Channel Auto-Sync

on:
  schedule:
    # Runs every Saturday at 21:00 UTC (Sunday 02:30 AM IST)
    - cron: '0 21 * * 6'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Weekly Channel Sync Script
        run: python scripts/weekly_channel_sync.py

      - name: Commit and Push Updated Channels
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json website/channels.json || true
          if git status --porcelain | grep -q 'channels.json'; then
            git commit -m "Auto-sync: Add new working channels from iptv-org rejected issues [skip ci]"
            git push origin main
          else
            echo "No channel updates found this week."
          fi
