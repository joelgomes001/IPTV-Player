name: Master Channel Database Auto-Sync

on:
  schedule:
    # Runs every 2 days at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 */2 * *'
  workflow_dispatch: # Manual trigger button on GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Full Channel Sync
        run: python scripts/full_channel_sync.py

      - name: Commit and Push Updated Channels
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json website/channels.json || true
          if git status --porcelain | grep -q 'channels.json'; then
            git commit -m "Auto-sync: Master database updated with new channels & stream URLs [skip ci]"
            git push origin main
          else
            echo "Master database is already up to date!"
          fi
