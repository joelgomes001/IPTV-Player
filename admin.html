<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | JTBS IPTV</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --admin-bg: #090d16;
      --admin-card-bg: rgba(15, 23, 42, 0.85);
      --admin-border: rgba(56, 189, 248, 0.2);
      --admin-accent: #38bdf8;
      --admin-gold: #facc15;
      --admin-green: #22c55e;
      --admin-red: #ef4444;
    }

    body {
      background: var(--admin-bg);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Login Screen */
    .admin-login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    .admin-login-card {
      background: var(--admin-card-bg);
      border: 1px solid var(--admin-border);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .admin-login-card h2 {
      margin-top: 0;
      color: var(--admin-gold);
      font-size: 1.8rem;
      letter-spacing: 0.5px;
    }

    .admin-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      outline: none;
      transition: all 0.2s;
    }

    .admin-input:focus {
      border-color: var(--admin-accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .admin-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .admin-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    .admin-btn-gold {
      background: linear-gradient(135deg, #d97706, #ca8a04);
    }

    .admin-btn-green {
      background: linear-gradient(135deg, #16a34a, #15803d);
    }

    .admin-btn-danger {
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    /* Admin Main Layout */
    .admin-header {
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--admin-border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--admin-gold);
    }

    .admin-container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      background: var(--admin-card-bg);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--admin-border);
    }

    .admin-search-box {
      display: flex;
      gap: 0.75rem;
      flex: 1;
      min-width: 280px;
    }

    .admin-table-container {
      background: var(--admin-card-bg);
      border-radius: 12px;
      border: 1px solid var(--admin-border);
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    table.admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.admin-table th {
      background: rgba(30, 41, 59, 0.9);
      color: var(--admin-accent);
      padding: 1rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--admin-border);
    }

    table.admin-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
      font-size: 0.95rem;
    }

    table.admin-table tr:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    .channel-logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      background: #020617;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .badge-genre {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-country {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Edit Modal */
    .admin-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .admin-modal-overlay.active {
      display: flex;
    }

    .admin-modal {
      background: #0f172a;
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .pagination {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="loginOverlay" class="admin-login-overlay">
    <div class="admin-login-card">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔒</div>
      <h2>JTBS IPTV Admin</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter Admin Password to manage channels</p>
      
      <input type="password" id="adminPasswordInput" class="admin-input" placeholder="Enter Admin Password" autocomplete="current-password">
      <button id="btnLogin" class="admin-btn">Login to Dashboard</button>
      <div id="loginError" style="color: var(--admin-red); font-size: 0.85rem; margin-top: 1rem; display: none;">Incorrect password!</div>
    </div>
  </div>

  <!-- Admin Main Dashboard Header -->
  <header class="admin-header">
    <div class="admin-title">
      <img src="logo.png" alt="JTBS" style="height: 32px; border-radius: 4px;">
      <span>JTBS IPTV Channel Admin</span>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <span id="statChannelCount" style="color: #94a3b8; font-size: 0.9rem;">0 Channels</span>
      <button id="btnSaveGithub" class="admin-btn admin-btn-green" style="width: auto; padding: 0.5rem 1.2rem;">💾 Save & Publish Database</button>
      <button id="btnLogout" class="admin-btn admin-btn-danger" style="width: auto; padding: 0.5rem 1rem;">Logout</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="admin-container">
    
    <!-- Toolbar -->
    <div class="admin-toolbar">
      <div class="admin-search-box">
        <input type="text" id="adminSearchInput" class="admin-input" style="margin-bottom: 0;" placeholder="Search channel name or URL...">
        <select id="adminGenreSelect" class="admin-input" style="margin-bottom: 0; width: 180px;">
          <option value="All">All Genres</option>
        </select>
        <select id="adminCountrySelect" class="admin-input" style="margin-bottom: 0; width: 180px;">
          <option value="All">All Countries</option>
        </select>
      </div>

      <button id="btnAddNewChannel" class="admin-btn admin-btn-gold" style="width: auto;">➕ Add New Channel</button>
    </div>

    <!-- Channels Table -->
    <div class="admin-table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th style="width: 60px;">Logo</th>
            <th>Channel Name</th>
            <th style="width: 140px;">Genre</th>
            <th style="width: 140px;">Country</th>
            <th>Stream URL</th>
            <th style="width: 140px; text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr>
            <td colspan="6" style="text-align: center; padding: 3rem; color: #94a3b8;">Loading master channel database...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button id="btnPrevPage" class="admin-btn" style="width: auto; padding: 0.4rem 1rem;">Previous</button>
      <span id="pageIndicator" style="color: #94a3b8; font-size: 0.9rem;">Page 1 of 1</span>
      <button id="btnNextPage" class="admin-btn" style="width: auto; padding: 0.4rem 1rem;">Next</button>
    </div>

  </div>

  <!-- Edit/Add Channel Modal -->
  <div id="editModal" class="admin-modal-overlay">
    <div class="admin-modal">
      <h3 id="modalTitle" style="color: var(--admin-gold); margin-top: 0;">Edit Channel</h3>
      
      <input type="hidden" id="editChannelId">

      <div class="form-group">
        <label for="editName">Channel Name</label>
        <input type="text" id="editName" class="admin-input" placeholder="e.g. DD National HD">
      </div>

      <div class="form-group">
        <label for="editGenre">Genre / Category</label>
        <select id="editGenre" class="admin-input">
          <option value="Entertainment">Entertainment</option>
          <option value="News">News</option>
          <option value="Movies">Movies</option>
          <option value="Music">Music</option>
          <option value="Sports">Sports</option>
          <option value="Religious">Religious</option>
          <option value="Kids">Kids</option>
          <option value="Documentary">Documentary</option>
          <option value="Lifestyle">Lifestyle</option>
          <option value="General">General</option>
          <option value="Education">Education</option>
          <option value="Shopping">Shopping</option>
          <option value="DD Channels">DD Channels</option>
        </select>
      </div>

      <div class="form-group">
        <label for="editCountry">Country</label>
        <input type="text" id="editCountry" class="admin-input" placeholder="e.g. India, United States, Bangladesh...">
      </div>

      <div class="form-group">
        <label for="editStreamUrl">Stream URL (.m3u8 / HLS / YouTube)</label>
        <input type="text" id="editStreamUrl" class="admin-input" placeholder="https://domain.com/live.m3u8">
      </div>

      <div class="form-group">
        <label for="editThumbnail">Direct Logo Image URL</label>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
          <input type="text" id="editThumbnail" class="admin-input" style="margin-bottom:0;" placeholder="https://logo-url.png">
          <img id="previewLogo" src="" style="width: 44px; height: 44px; object-fit: contain; background: #000; border-radius: 6px; display: none;">
        </div>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button id="btnCancelEdit" class="admin-btn" style="background: #334155;">Cancel</button>
        <button id="btnSaveChannel" class="admin-btn admin-btn-green">Save Channel</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
